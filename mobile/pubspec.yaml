name: scorvoai
description: AI-powered exam tutor for SSC, UPSC, and Banking
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  fl_chart: ^0.69.0
  image_picker: ^1.1.2
  flutter_scalable_ocr: ^2.2.1
  google_mlkit_text_recognition: ^0.14.0
  dio: ^5.7.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.0
  gpt_markdown: ^1.1.6
  flutter_riverpod: ^3.3.1
  shared_preferences: ^2.3.2
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0b0b18"
  adaptive_icon_foreground: "assets/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
